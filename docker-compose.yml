# The whole stack: PostgreSQL, the API and the web UI.
#   cp apps/api/.env.example .env     # then set GROQ_API_KEY
#   docker compose up --build         # UI on http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tripmate
      POSTGRES_PASSWORD: tripmate
      POSTGRES_DB: tripmate
    volumes:
      - tripmate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmate"]
      interval: 5s
      retries: 10

  api:
    build: apps/api
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      DATABASE_URL: postgresql+psycopg://tripmate:tripmate@db:5432/tripmate
    depends_on:
      db:
        condition: service_healthy

  web:
    build: apps/web
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  tripmate-pgdata:
