default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
exclude: ^\.claude/skills/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args: [--branch, main, --branch, devel]

  - repo: https://github.com/psf/black
    rev: 26.10.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd apps/api && mypy'
        language: system
        types: [python]
        pass_filenames: false
      - id: no-ai-attribution
        name: no AI attribution in commit message
        entry: scripts/check-commit-message.sh
        language: system
        stages: [commit-msg]
      - id: branch-name
        name: branch name
        entry: scripts/check-branch-name.sh
        language: system
        always_run: true
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: bash -c 'cd apps/api && pytest'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
